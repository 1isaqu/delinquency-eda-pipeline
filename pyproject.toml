[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "delinquency-eda-pipeline"
version = "0.1.0"
description = "A numbered, reproducible analysis pipeline for overdue-unpaid receivables: period selection, schema discovery, base build, censoring and drift checks, EDA, cleaning, and a payment-term model."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Isaque Carvalho" }]
keywords = ["collections", "delinquency", "eda", "censoring", "data-cleaning", "scikit-learn"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1,<3",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
sqlserver = ["pyodbc>=5"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
delinquency-eda = "delinquency_eda.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
filterwarnings = ["error::DeprecationWarning:delinquency_eda.*"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]
ignore = ["RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["delinquency_eda"]
known-local-folder = ["clirun", "demo_loader", "frames", "world"]
