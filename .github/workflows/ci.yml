name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: python -m pytest
      - name: Quick start on the demo databases
        env:
          DEA_BACKEND: sqlite
          DEA_SOURCES: auto=data/demo/auto.db,consumer=data/demo/consumer.db
          DEA_CONFIG: examples/settings.example.json
        run: |
          python examples/build_demo_db.py data/demo
          delinquency-eda schema
          delinquency-eda period --as-of 2026-03-31
          delinquency-eda base --from 2025-11-01 --to 2026-03-31 --as-of 2026-03-31
          delinquency-eda analysis
          delinquency-eda censoring
          delinquency-eda drift --reference-date 2026-03-27
          delinquency-eda eda
          delinquency-eda diagnose
          delinquency-eda clean
          delinquency-eda card --from-dataset
          delinquency-eda model
      - name: A database that breaks the entry contract is refused
        env:
          DEA_BACKEND: sqlite
          DEA_CONFIG: examples/settings.example.json
        run: |
          cp data/demo/auto.db data/demo/broken.db
          python -c "import sqlite3; c = sqlite3.connect('data/demo/broken.db'); c.execute('UPDATE agreements SET paid_amount = 0 WHERE paid_amount > 0'); c.commit()"
          set +e
          delinquency-eda --source auto=data/demo/broken.db --dataset data/broken.json --out-dir reports/broken base --from 2025-11-01 --to 2026-03-31 --as-of 2026-03-31
          code=$?
          set -e
          test "$code" -eq 1
          test ! -e data/broken.json
          grep -q "Result: REJECTED" reports/broken/admission.md
